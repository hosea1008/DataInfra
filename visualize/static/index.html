<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据管线可视化</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <h1 class="app-title">数据管线可视化</h1>
    <div class="health-group" id="health-group">
      <span class="health-item" id="health-production" title="生产库（只读）">
        <span class="health-dot health-unknown"></span>生产库（只读）
      </span>
      <span class="health-item" id="health-test" title="测试库">
        <span class="health-dot health-unknown"></span>测试库
      </span>
    </div>
  </div>
  <nav class="tab-nav" id="tab-nav" role="tablist">
    <button class="tab-btn is-active" data-tab="stats" type="button" role="tab" aria-selected="true">数据统计</button>
    <button class="tab-btn" data-tab="paths" type="button" role="tab" aria-selected="false">数据集存储路径</button>
    <button class="tab-btn" data-tab="versions" type="button" role="tab" aria-selected="false">版本进度</button>
    <button class="tab-btn" data-tab="tables" type="button" role="tab" aria-selected="false">表预览</button>
    <button class="tab-btn" data-tab="reset" type="button" role="tab" aria-selected="false">重置测试环境</button>
  </nav>
</header>
<main class="app-main">
  <section id="tab-versions" class="tab-panel" aria-label="版本进度"></section>
  <section id="tab-tables" class="tab-panel" aria-label="表预览"></section>
  <section id="tab-stats" class="tab-panel is-active" aria-label="数据统计"></section>
  <section id="tab-paths" class="tab-panel" aria-label="数据集存储路径"></section>
  <section id="tab-reset" class="tab-panel" aria-label="重置测试环境"></section>
</main>
<script src="/vendor/echarts.min.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
